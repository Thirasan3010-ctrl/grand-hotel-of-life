  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#120f0c;overflow:hidden;font-family:'Sarabun','Leelawadee UI',sans-serif;color:#f4ead2}
  #c{position:fixed;inset:0;z-index:0}
  .hud,.bar{z-index:3}
  .hud{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));pointer-events:none}
  .hud .e{font-family:'Mitr';font-size:12px;letter-spacing:.12em;color:#e6cf94}

  .bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
       background:rgba(20,16,12,.65);backdrop-filter:blur(8px);padding:8px 10px;border-radius:14px;border:1px solid rgba(230,207,148,.25)}
  .bar button{font-family:'Sarabun';font-size:14px;background:transparent;color:#f4ead2;border:1px solid rgba(230,207,148,.35);border-radius:9px;padding:6px 12px;cursor:pointer}
  .bar button:hover,.bar button.on{background:#c9a24a;color:#1e1608;border-color:#c9a24a}
  .lab{font-family:'Mitr';font-size:13px;background:rgba(255,250,240,.92);color:#1e2b4a;padding:4px 10px 4px 4px;border-radius:999px;
       display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}
  .lab b{background:#c9a24a;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  body.shot .bar,body.shot .hud{display:none}
  body.nolab .lab{display:none}
  @media (max-width:640px){
    .hud h1{font-size:18px}.hud p{display:none}.hud .e{font-size:10px}
    .bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:calc(100% - 24px);padding:6px;gap:6px;scrollbar-width:none}
    .bar button{white-space:nowrap;font-size:13px;padding:6px 10px;flex:none}

const tb=document.createElement('button');tb.textContent='▶ ทัวร์อัตโนมัติ';tb.onclick=()=>{tour=!tour;tourT=0;tb.classList.toggle('on',tour);};bar.appendChild(tb);
go(SHOT&&V[SHOT]?SHOT:'overview',true);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);labelR.setSize(innerWidth,innerHeight);});
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let frames=0,paused=false;
renderer.setAnimationLoop(()=>{
  if(paused)return;
  const now=performance.now();
  if(tween){const k=Math.min(1,(now-tween.s)/tween.d),e=ease(k);camera.position.lerpVectors(tween.p0,tween.p,e);controls.target.lerpVectors(tween.t0,tween.t,e);if(k>=1)tween=null;}
  if(tour&&!tween){tourT+=1;if(tourT>200){tourT=0;tourI=(tourI+1)%Object.keys(V).length;go(Object.keys(V)[tourI]);}}
  controls.update();composer.render();labelR.render(scene,camera);
  if(++frames===30)document.title+=' ✓';
});
</script>

</body>
